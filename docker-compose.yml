services:
  postgres:
    image: postgres:16-alpine
    container_name: home-ledger-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-home_ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-home_ledger_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-home_ledger}
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-home_ledger} -d ${POSTGRES_DB:-home_ledger}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
    driver: local
