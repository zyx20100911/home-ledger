services:
  postgres:
    image: postgres:16-alpine
    container_name: home-ledger-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-home_ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.prod 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-home_ledger}
      TZ: Asia/Shanghai
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-home_ledger} -d ${POSTGRES_DB:-home_ledger}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: home-ledger-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3000
      API_PREFIX: api/v1
      TRUST_PROXY: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER:-home_ledger}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-home_ledger}?schema=public
      JWT_SECRET: ${JWT_SECRET:?请在 .env.prod 中设置至少 32 位的强随机 JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_APP_TITLE: ${VITE_APP_TITLE:-家庭财务管理系统}
        VITE_API_BASE_URL: /api/v1
    container_name: home-ledger-prod-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-8080}:80'

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: home-ledger-cloudflared
    restart: unless-stopped
    profiles:
      - tunnel
    depends_on:
      - web
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  pg_prod_data:
    driver: local
